[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usetai-agentic-ai"
version = "0.1.0"
description = "Demo-focused Agentic AI project with open/free defaults"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "requests>=2.31.0",
  "wikipedia>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
usetai-demo = "usetai_agentic_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG"]
ignore = []
